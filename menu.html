<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>قائمة المطعم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
margin-bottom:25px;
color:#d32f2f;
}

.food{
background:white;
margin-bottom:20px;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.food img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:18px;
}

.name{
font-size:22px;
font-weight:bold;
}

.price{
color:#4caf50;
font-size:20px;
margin:12px 0;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#ff9800;
color:white;
font-size:18px;
cursor:pointer;
}

.cart{
position:fixed;
bottom:20px;
left:20px;
right:20px;
background:#4caf50;
}

</style>

</head>

<body>

<h1 id="restaurantName"></h1>

<div id="foods"></div>

<button class="cart"
onclick="location.href='cart.html'">

🛒 السلة

</button>

<script>

const restaurant =
new URLSearchParams(location.search).get("restaurant");

document.getElementById("restaurantName").innerHTML=restaurant;

const menu=[

{
name:"بيتزا مارجريتا",
price:800,
image:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=900"
},

{
name:"بيتزا بالخضر",
price:900,
image:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=900"
},

{
name:"بيتزا أربع أجبان",
price:1100,
image:"https://images.unsplash.com/photo-1548365328-9f547fb0953b?w=900"
}

];

const foods=document.getElementById("foods");

menu.forEach(item=>{

foods.innerHTML+=`

<div class="food">

<img src="${item.image}">

<div class="info">

<div class="name">${item.name}</div>

<div class="price">${item.price} دج</div>

<button onclick='add("${item.name}",${item.price})'>

إضافة إلى السلة

</button>

</div>

</div>

`;

});

function add(name,price){

let cart=
JSON.parse(localStorage.getItem("cart"))||[];

cart.push({
name,
price
});

localStorage.setItem("cart",JSON.stringify(cart));

alert("تمت الإضافة إلى السلة");

}

</script>

</body>
</html>

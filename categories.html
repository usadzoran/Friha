<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>التصنيفات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
margin-bottom:30px;
color:#e53935;
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:scale(1.02);
}

.back{
margin-top:40px;
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#222;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<h1 id="title"></h1>

<div id="list"></div>

<button class="back" onclick="history.back()">
رجوع
</button>

<script>

const params=new URLSearchParams(location.search);

const type=params.get("type");

const food=[
"🍕 بيتزا",
"🍔 أكل خفيف",
"🥪 سندويتش",
"🥩 لحوم",
"🥗 خضر",
"🍎 فواكه"
];

const drink=[
"🥤 مشروبات غازية",
"🧃 عصائر",
"💧 ماء",
"🥛 حليب"
];

let data=[];

if(type==="food"){
title.innerHTML="المأكولات";
data=food;
}else{
title.innerHTML="المشروبات";
data=drink;
}

const list=document.getElementById("list");

data.forEach(item=>{

list.innerHTML+=`

<div class="card"
onclick="go('${item}')">

${item}

</div>

`;

});

function go(name){

location.href=
"restaurants.html?category="+encodeURIComponent(name);

}

</script>

</body>
  </html>
